name: Build
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate shell scripts
        run: bash -n install.sh upgrade.sh scripts/install.sh scripts/upgrade.sh
      - name: Installer and rollback tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: dotnet build --configuration Release
      - name: Runtime regression tests (no live credentials)
        env:
          TEST_CODEX_REQUEST_TRACE: ${{ runner.temp }}/bloodraven-codex-requests.jsonl
        run: dotnet run --project tests/Bloodraven.Tests --configuration Release
      - name: Validate approval protocol against real Codex (no model calls)
        run: |
          mkdir -p "$RUNNER_TEMP/bloodraven-codex-contract"
          curl -fsSL --retry 3 https://github.com/openai/codex/releases/download/rust-v0.155.1/codex-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/bloodraven-codex-contract/codex.tar.gz"
          echo "a0ef8b2debc3bf747e07b1a039354de31300ac0dcc2276498ba281470b5d9115  $RUNNER_TEMP/bloodraven-codex-contract/codex.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bloodraven-codex-contract/codex.tar.gz" -C "$RUNNER_TEMP/bloodraven-codex-contract"
          "$RUNNER_TEMP/bloodraven-codex-contract/codex-x86_64-unknown-linux-musl" app-server generate-json-schema --out "$RUNNER_TEMP/bloodraven-codex-contract/schemas"
          python3 -m pip install jsonschema==4.23.0
          python3 tests/check_codex_protocol.py "$RUNNER_TEMP/bloodraven-codex-contract/schemas" "$RUNNER_TEMP/bloodraven-codex-requests.jsonl" "$RUNNER_TEMP/bloodraven-codex-contract/codex-x86_64-unknown-linux-musl"
  apparmor-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated profile with Ubuntu AppArmor parser
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor
          python3 - <<'PYCODE'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from apparmor import profile_text
          Path('/tmp/bloodraven-profile-test').write_text(profile_text(Path('/opt/codex test/node_modules/@openai/codex/bin/codex')))
          PYCODE
          sudo apparmor_parser -Q -T /tmp/bloodraven-profile-test
